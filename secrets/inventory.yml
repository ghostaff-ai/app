# Names only, never values. Format and the `secret` command:
# ~/githubs/_workspace/docs/secrets-inventory.md (Álvaro's workspace).
#
# sops (secrets/secrets.enc.yml) until the engine's Google Cloud project exists;
# then these move to its Secret Manager (AGENTS.md invariant 3: keys in a vault).
# The project URL is not stored: both apps read it from the key (it carries the ref).
secrets:
  # Bypasses row-level security: apps/sync and, later, the engine. Never the app.
  - name: SUPABASE_SERVICE_ROLE_KEY_BETA
    store: sops:secrets/secrets.enc.yml
    consumers: [apps/sync, copied to gsm:ghostaff-prod for apps/engine]
    expires: never
    renew: supabase.com/dashboard, project ghostaff-beta (rggvcvnstbitbdptiwtk), Settings, API Keys, Legacy, service_role (rotating means a new JWT secret, which also changes the anon key)
    owner: alvaro
    env:
      file: apps/sync/.env
      var: SUPABASE_SERVICE_ROLE_KEY

  # Sends the sign-in codes: Supabase Auth's custom SMTP (smtp.resend.com, user
  # `resend`) uses it as the password. Pasted there by hand; kept here to rebuild it.
  - name: RESEND_API_KEY_SUPABASE_SMTP
    store: sops:secrets/secrets.enc.yml
    consumers: [Supabase Auth SMTP of ghostaff-beta]
    expires: never
    renew: resend.com (ghostaff.ai@gmail.com), API keys, create one with Sending access for ghostaff.ai only; paste into Supabase, Authentication, Emails, SMTP Settings, Password; secret set; then delete the old key in Resend
    owner: alvaro
    spec: {permission: sending_access, domain: ghostaff.ai}

  # Public by design (it ships inside the app; row-level security is the guard).
  # Kept here only so `secret env` writes it where local runs read it. Beta builds
  # read it from EAS's `preview` environment instead.
  - name: SUPABASE_ANON_KEY_BETA
    store: sops:secrets/secrets.enc.yml
    consumers: [apps/mobile (local), EAS preview environment]
    expires: never
    renew: same page as above, anon public
    owner: alvaro
    env:
      file: apps/mobile/.env

  # Each environment's service-role key, in its own project's Secret Manager, put there by
  # scripts/setup-env.sh straight from Supabase's API (docs/plans/ongoing/environments.md, decision 1).
  # The engine on Cloud Run reads it as SUPABASE_SERVICE_ROLE_KEY. Renewing: rotate it in Supabase,
  # then pipe the new one in (`gcloud secrets versions add SUPABASE_SERVICE_ROLE_KEY --project <project> --data-file=-`).
  - name: SUPABASE_SERVICE_ROLE_KEY
    store: gsm:ghostaff-beta
    consumers: [apps/engine (Cloud Run service engine in ghostaff-beta, europe-west1)]
    expires: never
    renew: as above, project ghostaff-beta
    owner: jaime
  - name: SUPABASE_SERVICE_ROLE_KEY
    store: gsm:ghostaff-prod
    consumers: [apps/engine (Cloud Run service engine in ghostaff-prod, europe-west1)]
    expires: never
    renew: as above, project ghostaff-prod
    owner: jaime

#
# Not listed, because no person stores them: each organisation's own AI keys,
# written and deleted by apps/engine when an owner connects or removes one in
# the app. In each environment's Secret Manager, named org-<org uuid>-ai-<provider>, labelled
# org_id and provider, stored only in europe-west1.

  # Google sign-in's web OAuth client (ghostaff-prod, Google Auth Platform, Clients,
  # "Ghostaff web (and Supabase)"). Only the browser flow (Expo Go) needs it: Supabase
  # trades Google's code for the token with it. Pasted into ghostaff-beta's Google
  # provider by hand; locally `supabase start` reads it from supabase/.env.
  - name: SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET
    store: sops:secrets/secrets.enc.yml
    consumers: [Supabase Auth Google provider of ghostaff-beta, local Supabase]
    expires: never
    renew: console.cloud.google.com, project ghostaff-prod, Google Auth Platform, Clients, the web client, Add secret, download its JSON; secret set --from-file with the value; paste into Supabase, Authentication, Sign In / Providers, Google; then disable and delete the old secret
    owner: alvaro
    env:
      file: supabase/.env
