name: CI

# The beta app waits for this whole workflow, end-to-end tests included, to pass
# on develop (beta.yml). Markdown alone changes no code, so it runs nothing.
on:
  push:
    branches: [develop, main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [develop, main]
    paths-ignore: ['**/*.md', 'docs/**']
  # By hand, to re-run CI on a branch; beta.yml accepts such a run on develop like a push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  database:
    name: Row-level security (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only Postgres: the migrations, the seed and the policy tests need nothing else.
      - run: pnpm exec supabase db start
      - run: pnpm db:test

  e2e-android:
    name: End-to-end (Android)
    # The real app, as a release build, on an Android emulator against a local
    # Supabase: the Maestro flows in .maestro/flows/ci (sign-in, sign-up,
    # creating a company and walking its tabs, a cold relaunch). A release
    # build is what reaches phones, so a crash only it has (R8, a native module)
    # shows up here and not on Metro. Same script as locally: scripts/e2e/android.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The release build, Supabase's images and the emulator's system image
      # don't fit the runner's disk next to everything it comes with.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: pnpm install --frozen-lockfile

      # Auth (and Mailpit, where the sign-in codes land), the API and Realtime;
      # what the app doesn't use stays off to save the runner's memory.
      - name: Start the local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Build the release APK
        run: |
          bash scripts/e2e/android.sh build
          # Only the APK is needed from here on; the build's intermediates are gigabytes.
          rm -rf apps/mobile/android/app/build/intermediates apps/mobile/android/app/.cxx apps/mobile/android/build
          find node_modules/.pnpm -path '*/android/build' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          df -h /
          # The build's daemons stay alive holding gigabytes the emulator needs: a private
          # repo's runner has about 7 GB, and running out kills the runner mid-boot.
          (cd apps/mobile/android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true
          free -m

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_SERIAL: emulator-5554
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000
        with:
          # Android 14 with Google APIs: lighter on a 2-core runner than the
          # local emulator's 16, with a keyboard (the flows hide it; the
          # stripped test-device image has none, and hiding one there leaves
          # the app). Google sign-in (flows/google) runs only locally.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          # A slow boot's "System UI isn't responding" would cover the app: hidden.
          script: |
            adb -s emulator-5554 shell settings put global hide_error_dialogs 1
            bash scripts/e2e/android.sh test

      - name: Keep Maestro's screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: |
            ~/.maestro/tests/
            ~/.local/state/maestro/tests/
          if-no-files-found: ignore
