appId: ${APP_ID}
name: An owner adds who the company works with outside, and changes it
---
# «Con quién trabajáis» (docs/plans/ongoing/external-parties.md). A new owner
# opens it from Empresa, finds it empty, adds a freelance illustrator with what
# she does, a department and her email, sees her in the list, then opens her
# and changes what she does. No engine runs in e2e, so nothing reaches a record.
- evalScript: ${output.email = 'e2e-ext-' + Date.now() + '@ghostaff.test'}
- evalScript: ${output.company = 'Imprenta E2E ' + Date.now().toString().slice(-6)}
- runFlow:
    file: ../subflows/sign-in-email.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible: "¿Cómo te llamas?"
    timeout: 30000
- tapOn: "Nombre y apellido"
- inputText: "Eva E2E"
- tapOn: "Seguir"
- extendedWaitUntil:
    visible: "¿Para qué vas a usar Ghostaff?"
    timeout: 30000
- tapOn: "Para mi empresa.*"
- tapOn: "Seguir"
- extendedWaitUntil:
    visible: "Por ejemplo, Panadería Ana"
    timeout: 15000
- tapOn: "Por ejemplo, Panadería Ana"
- inputText: ${output.company}
- tapOn: "Crear"
- extendedWaitUntil:
    visible: "Conecta tu IA"
    timeout: 30000
- runScript:
    file: ../../scripts/connect-ai.js
    env:
      COMPANY: ${output.company}
      SUPABASE_URL: ${SUPABASE_URL}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Secretaría"
    timeout: 60000
- tapOn: "Empresa"
- extendedWaitUntil:
    visible:
      id: "open-externals"
    timeout: 20000
- tapOn:
    id: "open-externals"
- extendedWaitUntil:
    visible: "Aún no hay nadie"
    timeout: 20000
- tapOn:
    id: "external-add-first"
- extendedWaitUntil:
    visible:
      id: "external-name"
    timeout: 15000
- tapOn:
    id: "external-name"
- inputText: "Ana López"
- tapOn:
    id: "external-role"
- inputText: "Hace las ilustraciones de los carteles"
- hideKeyboard
- tapOn:
    id: "external-department-marketing"
- scrollUntilVisible:
    element:
      id: "external-email"
- tapOn:
    id: "external-email"
- inputText: "ana@ejemplo.com"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "external-save"
- tapOn:
    id: "external-save"
# Back on the list: her name, what she does and the department.
- extendedWaitUntil:
    visible: "Hace las ilustraciones de los carteles · Marketing"
    timeout: 20000
- tapOn: "Ana López"
- extendedWaitUntil:
    visible:
      id: "external-role"
    timeout: 15000
- tapOn:
    id: "external-role"
- eraseText: 60
- inputText: "Ilustra y maqueta los carteles"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "external-save"
- tapOn:
    id: "external-save"
- extendedWaitUntil:
    visible: "Ilustra y maqueta los carteles · Marketing"
    timeout: 20000
