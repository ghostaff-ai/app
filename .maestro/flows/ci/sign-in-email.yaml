appId: ${APP_ID}
name: A new person signs up with the emailed code, gives their name and is asked what Ghostaff is for
---
- evalScript: ${output.email = 'e2e-' + Date.now() + '@ghostaff.test'}
- runFlow:
    file: ../subflows/sign-in-email.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible: "¿Cómo te llamas?"
    timeout: 30000
- tapOn: "Nombre y apellido"
- inputText: "Prueba E2E"
# No hideKeyboard: «Seguir» is pinned above the keyboard (welcome-and-spaces.md).
- tapOn: "Seguir"
- extendedWaitUntil:
    visible: "¿Para qué vas a usar Ghostaff?"
    timeout: 30000
- assertVisible: "Para mí.*"
- assertVisible: "Para mi empresa.*"
