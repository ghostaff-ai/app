appId: ${APP_ID}
name: A new person wants Ghostaff for themselves, gets their personal space and connects its AI
---
# «Para mí» (welcome-and-spaces.md): no form, the personal space is made on
# «Seguir», Secretaría comes hired, and the owner is asked for the AI before
# anything else (a stand-in subscription is written into the local database,
# scripts/connect-ai.js, found by the owner's name: every personal space is
# called «Personal»).
- evalScript: ${output.email = 'e2e-me-' + Date.now() + '@ghostaff.test'}
- evalScript: ${output.name = 'Yo E2E ' + Date.now().toString().slice(-6)}
- runFlow:
    file: ../subflows/sign-in-email.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible: "¿Cómo te llamas?"
    timeout: 30000
- tapOn: "Nombre y apellido"
- inputText: ${output.name}
- tapOn: "Seguir"
- extendedWaitUntil:
    visible: "¿Para qué vas a usar Ghostaff?"
    timeout: 30000
- tapOn: "Para mí.*"
- tapOn: "Seguir"
- extendedWaitUntil:
    visible: "Conecta tu IA"
    timeout: 30000
- assertVisible:
    id: "connect-ai-claude"
- assertVisible: "Tus agentes trabajan con tu cuenta de IA.*"
- runScript:
    file: ../../scripts/connect-ai.js
    env:
      OWNER_NAME: ${output.name}
      SUPABASE_URL: ${SUPABASE_URL}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
- stopApp
- launchApp
# Equipo, the first tab, with Secretaría; the space's name is on Empresa.
- extendedWaitUntil:
    visible: "Secretaría"
    timeout: 60000
- tapOn: "Empresa"
- extendedWaitUntil:
    visible: "Personal"
    timeout: 20000
- tapOn: "Equipo"
- extendedWaitUntil:
    visible: "Secretaría"
    timeout: 20000
