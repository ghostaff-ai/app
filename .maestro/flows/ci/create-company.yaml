appId: ${APP_ID}
name: A new person creates a company, connects its AI, walks its four tabs and reorders its AI accounts
---
# The first thing anyone does after signing up: say it's for their company, name it, be asked
# to connect an AI account (the step can't be skipped; a stand-in key and a
# stand-in subscription are written into the local database, scripts/connect-ai.js),
# land on Hoy, and open Equipo, Registro and Conexiones (only what is
# connected, then «Añadir conexión»). Secretaría comes
# hired with the company; another vacancy is filled, which opens the agent's page (no engine runs in e2e, so no first
# thread). In Conexiones the owner moves the key below the subscription.
- evalScript: ${output.email = 'e2e-co-' + Date.now() + '@ghostaff.test'}
- evalScript: ${output.company = 'Panadería E2E ' + Date.now().toString().slice(-6)}
- runFlow:
    file: ../subflows/sign-in-email.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible: "¿Cómo te llamas?"
    timeout: 30000
- tapOn: "Nombre y apellido"
- inputText: "Ana E2E"
- tapOn: "Seguir"
- extendedWaitUntil:
    visible: "¿Para qué vas a usar Ghostaff?"
    timeout: 30000
- tapOn: "Para mi empresa.*"
- tapOn: "Seguir"
- extendedWaitUntil:
    visible: "Por ejemplo, Panadería Ana"
    timeout: 15000
- tapOn: "Por ejemplo, Panadería Ana"
- inputText: ${output.company}
- tapOn: "Crear"
# An owner connects the team's AI before anything else: offered, not skippable.
- extendedWaitUntil:
    visible: "Conecta tu IA"
    timeout: 30000
- assertVisible:
    id: "connect-ai-claude"
- assertNotVisible: "Hoy"
- runScript:
    file: ../../scripts/connect-ai.js
    env:
      COMPANY: ${output.company}
      SUPABASE_URL: ${SUPABASE_URL}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
# The app reads the connections again on launch and lets the owner in.
- stopApp
- launchApp
# Hoy: the company's name on top, the greeting under it.
- extendedWaitUntil:
    visible: ${output.company}
    timeout: 60000
- assertVisible: ".*(Buenos días|Buenas tardes|Buenas noches), Ana.*"
- tapOn: "Equipo"
- extendedWaitUntil:
    visible:
      id: "vacancy-.*"
    timeout: 20000
- tapOn:
    id: "vacancy-.*"
- extendedWaitUntil:
    visible: "Que empiece"
    timeout: 15000
- tapOn: "Que empiece"
- extendedWaitUntil:
    visible: "Conversaciones"
    timeout: 20000
- back
- tapOn: "Registro"
- extendedWaitUntil:
    visible: "Lo decidido, lo último primero."
    timeout: 20000
# Conexiones lists only what is connected: the two AI accounts, in the order
# the agents try them, the key first, as added.
- tapOn: "Conexiones"
- extendedWaitUntil:
    visible:
      id: "ai-down-1"
    timeout: 20000
- assertVisible: "1. Claude con tu clave"
- assertVisible: "2. Claude con tu suscripción"
- tapOn:
    id: "ai-down-1"
- extendedWaitUntil:
    visible: "1. Claude con tu suscripción"
    timeout: 15000
- assertVisible: "2. Claude con tu clave"
# «Añadir conexión» opens everything there is to connect.
- tapOn:
    id: "add-connection"
- extendedWaitUntil:
    visible: "Instagram, facturas, citas…"
    timeout: 15000
- assertVisible:
    id: "add-ai-claude"
- back
- extendedWaitUntil:
    visible:
      id: "ai-account-1"
    timeout: 15000
# A cold relaunch keeps the session and comes back to the company, not a crash.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ${output.company}
    timeout: 60000
