appId: ${APP_ID}
name: A new person creates a company, connects its AI, walks its three tabs and reorders its AI accounts
---
# The first thing anyone does after signing up: say it's for their company, name it, be asked
# to connect an AI account (the step can't be skipped; a stand-in key and a
# stand-in subscription are written into the local database, scripts/connect-ai.js),
# land on Equipo, fill a vacancy, and open Decisiones, then Empresa's Registro
# and Conexiones (only what is connected, then «Añadir conexión»). In
# Conexiones the owner moves the key below the subscription.
- evalScript: ${output.email = 'e2e-co-' + Date.now() + '@ghostaff.test'}
- evalScript: ${output.company = 'Panadería E2E ' + Date.now().toString().slice(-6)}
- runFlow:
    file: ../subflows/sign-in-email.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible: "¿Cómo te llamas?"
    timeout: 30000
- tapOn: "Nombre y apellido"
- inputText: "Ana E2E"
- tapOn: "Seguir"
- extendedWaitUntil:
    visible: "¿Para qué vas a usar Ghostaff?"
    timeout: 30000
- tapOn: "Para mi empresa.*"
- tapOn: "Seguir"
- extendedWaitUntil:
    visible: "Por ejemplo, Panadería Ana"
    timeout: 15000
- tapOn: "Por ejemplo, Panadería Ana"
- inputText: ${output.company}
- tapOn: "Crear"
# An owner connects the team's AI before anything else: offered, not skippable.
- extendedWaitUntil:
    visible: "Conecta tu IA"
    timeout: 30000
- assertVisible:
    id: "connect-ai-claude"
- assertNotVisible: "Equipo"
- runScript:
    file: ../../scripts/connect-ai.js
    env:
      COMPANY: ${output.company}
      SUPABASE_URL: ${SUPABASE_URL}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
# The app reads the connections again on launch and lets the owner in.
- stopApp
- launchApp
# Equipo first: Secretaría comes hired with the company. «Añadir agente»
# fills a vacancy, which opens the chat with it (no engine runs in e2e, so it
# stays quiet).
- extendedWaitUntil:
    visible: "Secretaría"
    timeout: 60000
- tapOn:
    id: "add-agent"
- extendedWaitUntil:
    visible:
      id: "vacancy-.*"
    timeout: 20000
- tapOn:
    id: "vacancy-.*"
- extendedWaitUntil:
    visible: "Que empiece"
    timeout: 15000
- tapOn: "Que empiece"
- extendedWaitUntil:
    visible: "Esta conversación es solo entre tú y .*"
    timeout: 20000
- back
- back
- tapOn: "Decisiones"
- extendedWaitUntil:
    visible: "Nada que decidir"
    timeout: 20000
# Empresa: the company's name on top, then Registro and Conexiones.
- tapOn: "Empresa"
- extendedWaitUntil:
    visible: ${output.company}
    timeout: 20000
- tapOn: "Registro"
- extendedWaitUntil:
    visible: "Lo decidido, lo último primero."
    timeout: 20000
- back
- tapOn:
    id: "open-connections"
# Conexiones lists only what is connected: the two AI accounts, in the order
# the agents try them, the key first, as added.
- tapOn: "Conexiones"
- extendedWaitUntil:
    visible:
      id: "ai-down-1"
    timeout: 20000
- assertVisible: "1. Claude con tu clave"
- assertVisible: "2. Claude con tu suscripción"
- tapOn:
    id: "ai-down-1"
- extendedWaitUntil:
    visible: "1. Claude con tu suscripción"
    timeout: 15000
- assertVisible: "2. Claude con tu clave"
# An account that is not first says which one the agents use before it, and
# «Usar esta primero» puts it back on top.
- tapOn:
    id: "ai-account-2"
- extendedWaitUntil:
    visible: "Tus agentes usan antes «Claude con tu suscripción».*"
    timeout: 15000
- tapOn:
    id: "ai-use-first"
- extendedWaitUntil:
    notVisible:
      id: "ai-used-before"
    timeout: 15000
- back
- extendedWaitUntil:
    visible: "1. Claude con tu clave"
    timeout: 15000
- assertVisible: "2. Claude con tu suscripción"
# «Añadir conexión» opens everything there is to connect.
- tapOn:
    id: "add-connection"
- extendedWaitUntil:
    visible: "Instagram, facturas, citas…"
    timeout: 15000
- assertVisible:
    id: "add-ai-claude"
- back
- extendedWaitUntil:
    visible:
      id: "ai-account-1"
    timeout: 15000
# A cold relaunch keeps the session and comes back to the company's team, not a crash.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Secretaría"
    timeout: 60000
