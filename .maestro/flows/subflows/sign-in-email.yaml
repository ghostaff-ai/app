appId: ${APP_ID}
name: Sign in with the emailed code
---
# Usage: runFlow with env EMAIL. A new email signs up; the code comes from
# Mailpit (scripts/mailpit-code.js), so it only works against the local Supabase.
- runFlow: launch-clean.yaml
- tapOn:
    id: "signin-email"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: "Mandarme el código"
- extendedWaitUntil:
    visible:
      id: "signin-code"
    timeout: 20000
- runScript:
    file: ../../scripts/mailpit-code.js
    env:
      EMAIL: ${EMAIL}
      MAILPIT_URL: ${MAILPIT_URL}
- tapOn:
    id: "signin-code"
# The sixth digit signs in on its own: no "Entrar" tap, and the screen may
# already be gone, so no hideKeyboard either.
- inputText: ${output.code}
- extendedWaitUntil:
    notVisible:
      id: "signin-code"
    timeout: 30000
